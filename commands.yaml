# Catalogo de intents.
#
# COMO FUNCIONA
#   - `examples` son anclas semanticas, NO patrones. Al arrancar se codifican a
#     vectores una sola vez; en runtime tu frase se compara por coseno contra
#     todas. Por eso "esta no me gusta" acierta media.next aunque no comparta
#     ninguna palabra con "siguiente cancion".
#   - `literal` son frases exactas (tras normalizar acentos/mayusculas). Se
#     comprueban antes que los embeddings y cuestan cero. Pon aqui solo las
#     formas que repites a diario.
#   - `slot_patterns` se aplican SOLO despues de que el intent ya esta decidido,
#     asi que no tienen que desambiguar nada. Por eso "pon" puede aparecer en
#     spotify.play y en app.open sin conflicto.
#
# COMO AMPLIARLO
#   Anade una frase a `examples` y reinicia. Si un comando escala al LLM (lo
#   veras en el log como stage=llm), esa frase es justo la que falta aqui.

intents:
  # ---------------------------------------------------------------- reproduccion
  media.next:
    tool: media.next
    literal:
      - siguiente cancion
      - pasa la cancion
      - siguiente
    examples:
      - siguiente cancion
      - pasa la cancion
      - cambia de cancion
      - cambiala
      - pon la siguiente
      - saltate esta cancion
      - esta cancion no me gusta
      - quita esta cancion
      - ponme otra cancion
      - adelanta la cancion
      - siguiente tema
      - otra
      # Sin este ejemplo, "no quiero escuchar esta" se iba a volume.up (0.932)
      # arrastrada por "no te escucho bien".
      - no quiero escuchar esta cancion
      - no me gusta esta
      # "pasala" y "regresala" son casi identicas lexicamente y opuestas en
      # significado: si solo una de las dos esta anclada, el encoder se lleva la
      # otra consigo. Hay que declarar ambos lados.
      - pasala
      - saltala
      # OJO CON LA NEGACION: "me gusta esta cancion" (spotify.like) y "no me
      # gusta esta" (aqui) se diferencian en una sola palabra, y los embeddings
      # manejan mal la negacion. Ambos lados necesitan anclas propias y
      # abundantes; si anades ejemplos a uno, revisa el otro.
      - brinca esta cancion
      - esta cancion no
      - quitala
    confirmation: null

  media.previous:
    tool: media.previous
    literal:
      - cancion anterior
      - anterior
    examples:
      - cancion anterior
      - pon la anterior
      - vuelve a la cancion anterior
      - regresa la cancion
      - retrocede una cancion
      - vuelve atras
      - ponla otra vez desde el principio
      - repite la cancion
      # Formas encliticas de una sola palabra: el encoder no las relaciona con
      # "regresa la cancion" por si solo.
      - regresala
      - devuelvela
    confirmation: null

  media.play_pause:
    tool: media.play_pause
    literal:
      - pausa
      - pausa la musica
      - reanuda
    examples:
      - pausa la musica
      - para la musica
      - deten la reproduccion
      - silencia la cancion un momento
      - reanuda la musica
      - sigue la musica
      - dale play
      - continua la cancion
      - quita la pausa
      # LA MITAD "REANUDAR" ESTABA MUY POCO ANCLADA y se caia a los vecinos:
      # "despausa la cancion" iba a media.next (0.670) y "reanuda la cancion" a
      # media.previous (0.770), arrastrada por "repite la cancion". Hacen falta
      # tantas formas de reanudar como de pausar; el verbo "despausar" no lo
      # relaciona el encoder con "quita la pausa" por si solo.
      - despausa
      - despausa la cancion
      - despausa la musica
      - despausa spotify
      - quita la pausa de spotify
      - reanuda la cancion
      - reanuda spotify
      - sigue con la cancion
      - continua reproduciendo
      - dale play a spotify
      # NO anclar aqui formas del tipo "vuelve a poner la cancion que estaba" o
      # "ponla de nuevo a sonar": en espanol son ambiguas de verdad -pueden
      # significar reanudar o volver a la anterior- y arrastraron "pon otra vez
      # la cancion pasada" de media.previous hasta aqui (0.632). Reanudar se
      # ancla con formas que solo pueden ser reanudar.
      # Enciticas de pausar. "detenla" caia en media.next (0.376), que no es
      # "no entiendo" sino la accion contraria: salta de cancion en vez de
      # pausar. Van pegadas a "pasala"/"quitala" de media.next, asi que al tocar
      # cualquiera de las dos listas hay que medir la otra.
      - detenla
      - parala
      - paralo
    confirmation: null

  spotify.play:
    tool: spotify.play
    examples:
      - pon la playlist de rock
      - reproduce musica electronica
      - pon algo de jazz
      - quiero escuchar a los beatles
      - ponme el album de daft punk
      - reproduce la cancion bohemian rhapsody
      - pon mis canciones favoritas
      - pon la lista de reproduccion de entrenamiento
      # "pon musica de los 80" empataba con media.play_pause (0.893 vs 0.892).
      # Se ancla solo la forma en letra: la variante con digitos la cubre el
      # encoder por generalizacion, y asi el test la sigue midiendo de verdad.
      - pon musica de los ochenta
      - ponme reggaeton
    slot_patterns:
      # "pon la playlist de rock" -> query="rock", tipo=playlist
      - '^(?:pon|ponme|reproduce|pone)\s+(?:me\s+)?(?:la|el|las|los|un|una|mi|mis)?\s*(?:lista\s+de\s+reproduccion|playlist|album|disco|cancion|tema|musica)\s+(?:de\s+|del\s+|de\s+la\s+)?(?P<query>.+?)\s*$'
      # "quiero escuchar a los beatles" -> query="los beatles"
      - '^(?:quiero\s+escuchar|escuchar|pon|ponme|reproduce)\s+(?:a\s+|algo\s+de\s+|musica\s+de\s+)?(?P<query>.+?)\s*$'
    slots_required: true
    confirmation: null

  # -------------------------------------------------------------------- volumen
  #
  # NOTA DE DISENO: el volumen del PC y el de Spotify NO son intents distintos.
  # "sube el volumen" y "sube el volumen de spotify" comparten casi todas las
  # palabras y el coseno centrado no las separa de forma fiable -es el mismo
  # caso que app.open contra web.open-. Asi que hay un intent por DIRECCION y el
  # destino viaja en el slot `target`, que se extrae despues de decidir el
  # intent y por tanto no desambigua nada.
  #
  # Sin destino en la frase manda `fixed_args` y se controla el PC, que es lo
  # que uno espera al decir "sube el volumen" a secas.
  #
  # El patron del destino se repite en los cuatro intents a proposito: es el
  # precio de que `slot_patterns` sea por intent, y es preferible a un alias de
  # YAML que oculte que cada intent decide sus propios slots.

  volume.up:
    tool: volume.step
    literal:
      - sube el volumen
      - mas volumen
    examples:
      - sube el volumen
      - sube el sonido
      - mas volumen
      - ponlo mas alto
      - no te escucho bien
      - esta muy bajo
      - aumenta el volumen
      # Variantes con destino. Van en ESTE intent y no en uno propio; ver la
      # nota de diseno de arriba.
      - sube el volumen de spotify
      - sube el volumen de la musica
      - sube la musica
      - ponle mas volumen a spotify
      - sube el volumen de la cancion
      # "sube el volumen al 50" ganaba aqui (0.635) en vez de en volume.set: el
      # verbo pesa mas que el numero. En vez de pelear con el router, este
      # intent tambien extrae el nivel y la skill lo prefiere sobre el paso, asi
      # que da igual cual de los dos gane. Ver VolumeStepSkill.execute.
      - sube el volumen al cincuenta
    slot_patterns:
      - '(?P<target>spotify|espotifai|la musica|el reproductor|la cancion|musica)'
      # Solo con "a/al/en" delante: sin eso, "sube el volumen 3 rayitas" o
      # cualquier cifra suelta se interpretaria como destino absoluto.
      - '\b(?:al?|en)\s+(?P<level>\d{1,3})\b'
      # El nivel en palabras se ata al vocabulario de numbers.py. Con un
      # `[a-z\s]+` generico, "sube el volumen en spotify" capturaba
      # level="spotify": inofensivo porque parse_spanish_number lo rechaza,
      # pero es correccion por accidente, no por diseno.
      - '(?:al?|en)\s+(?P<level>(?:cien(?:to)?|noventa|ochenta|setenta|sesenta|cincuenta|cuarenta|treinta|veinti\w+|veinte|dieci\w+|quince|catorce|trece|doce|once|diez|nueve|ocho|siete|seis|cinco|cuatro|tres|dos|un[oa]?|cero)(?:\s+y\s+\w+)?)\b'
    fixed_args:
      delta: 10
    confirmation: null

  volume.down:
    tool: volume.step
    literal:
      - baja el volumen
      - menos volumen
    examples:
      - baja el volumen
      - baja el sonido
      - menos volumen
      - ponlo mas bajo
      - esta muy alto
      - bajale
      - reduce el volumen
      - baja el volumen de spotify
      - baja el volumen de la musica
      # OJO: "baja la musica" esta a un paso de "para la musica"
      # (media.play_pause). Ambos lados necesitan anclas; si tocas uno, mide el
      # otro con scripts/diagnose_router.py.
      - baja la musica
      - ponle menos volumen a spotify
      - baja el volumen de la cancion
      # Mismo motivo que en volume.up: el nivel explicito gana al paso.
      - baja el volumen al veinte
    slot_patterns:
      - '(?P<target>spotify|espotifai|la musica|el reproductor|la cancion|musica)'
      - '\b(?:al?|en)\s+(?P<level>\d{1,3})\b'
      # El nivel en palabras se ata al vocabulario de numbers.py. Con un
      # `[a-z\s]+` generico, "sube el volumen en spotify" capturaba
      # level="spotify": inofensivo porque parse_spanish_number lo rechaza,
      # pero es correccion por accidente, no por diseno.
      - '(?:al?|en)\s+(?P<level>(?:cien(?:to)?|noventa|ochenta|setenta|sesenta|cincuenta|cuarenta|treinta|veinti\w+|veinte|dieci\w+|quince|catorce|trece|doce|once|diez|nueve|ocho|siete|seis|cinco|cuatro|tres|dos|un[oa]?|cero)(?:\s+y\s+\w+)?)\b'
    fixed_args:
      delta: -10
    confirmation: null

  volume.set:
    tool: volume.set
    examples:
      - pon el volumen al cincuenta por ciento
      - volumen al veinte
      - deja el volumen en treinta
      - ajusta el volumen a setenta
      - pon el volumen de spotify al cincuenta
      - pon la musica al treinta por ciento
      - deja spotify en cuarenta
      # "pon spotify al treinta" ganaba a volume.up por solo 0.03; sin una forma
      # anclada que omita la palabra "volumen" el margen es demasiado fino.
      - pon spotify al setenta
      - deja la musica en veinte
    slot_patterns:
      # Whisper a veces devuelve digitos ("volumen al 50") y a veces palabras
      # ("volumen al cincuenta"). Se captura crudo y la skill lo convierte:
      # el router extrae, la skill valida y coacciona.
      - '(?P<level>\d{1,3})'
      # El `(?:de ...)?` intermedio existe para que "volumen de spotify al
      # cincuenta" siga entregando el nivel: sin el, la parte anclada se rompe
      # y solo se extraeria el destino, dejando la skill sin `level`.
      - '^(?:pon|ponme|deja|dejame|ajusta|sube|baja|cambia)?\s*(?:me\s+)?(?:el\s+)?volumen\s+(?:de\s+(?:la\s+|el\s+)?\w+\s+)?(?:al?|en)\s+(?P<level>.+?)(?:\s+por\s+ciento)?\s*$'
      # "pon spotify al treinta": aqui la palabra "volumen" ni aparece.
      - '^(?:pon|ponme|deja|dejame|ajusta|baja|sube|cambia)\s+(?:la\s+|el\s+)?(?:spotify|musica|cancion|reproductor)\s+(?:al?|en)\s+(?P<level>.+?)(?:\s+por\s+ciento)?\s*$'
      # Destino: patron aparte porque es independiente del nivel. `extract_slots`
      # acumula por clave, asi que este anade `target` sin pisar `level`.
      - '(?P<target>spotify|espotifai|la musica|el reproductor|la cancion|musica)'
    slots_required: true
    confirmation: null

  volume.mute:
    tool: volume.mute
    literal:
      - silencio
      - silencia
    examples:
      - silencia el sonido
      - quita el sonido
      - mutea
      - callate
      - silencio
      # "sin sonido" se iba a volume.down (0.932 vs 0.921) sin este ejemplo.
      - sin sonido
      - quita el audio del todo
      # OJO: "silencia spotify" choca con "silencia la cancion un momento"
      # (media.play_pause), que significa PAUSAR, no mutear. Los dos estan
      # anclados; medir ambos al tocar cualquiera.
      - silencia spotify
      - mutea spotify
      - quita el sonido de spotify
    slot_patterns:
      - '(?P<target>spotify|espotifai|la musica|el reproductor|la cancion|musica)'
    confirmation: null

  volume.query:
    tool: volume.query
    examples:
      - a que volumen esta
      - que volumen tengo
      - cual es el volumen actual
      - a que volumen esta spotify
      - que volumen tiene la musica
    slot_patterns:
      - '(?P<target>spotify|espotifai|la musica|el reproductor|la cancion|musica)'
    confirmation: null

  # --------------------------------------------------- abrir (apps y webs juntas)
  # NOTA DE DISENO: "abre spotify" (app) y "abre youtube" (web) son la MISMA
  # intencion. Separarlas en dos intents fallaba: medido, "abreme el chrome"
  # ganaba web.open con 0.942 frente a app.open con 0.922. La ambiguedad no es
  # semantica sino de resolucion, asi que se decide donde toca: la skill
  # `open.target` mira primero la allowlist de apps, luego el mapa de sitios, y
  # si no reconoce nada cae a una busqueda web.
  open.target:
    tool: open.target
    examples:
      - abre spotify
      - abreme el discord
      - inicia el navegador
      - ejecuta la calculadora
      - lanza visual studio code
      - arranca steam
      - quiero abrir el explorador de archivos
      - abre el bloc de notas
      - abre youtube
      - entra a github
      - llevame a gmail
      - abre la pagina de twitch
      - ve a reddit
      - abreme el correo
    slot_patterns:
      - '^(?:abre|abreme|abrime|abrir|inicia|iniciar|ejecuta|ejecutar|lanza|lanzar|arranca|arrancar|corre|entra\s+a|entra\s+en|ve\s+a|vete\s+a|llevame\s+a|navega\s+a|visita)\s+(?:me\s+)?(?:el|la|los|las|un|una)?\s*(?:aplicacion|app|programa|proceso|pagina|sitio|web)?\s*(?:de\s+)?(?P<target>.+?)\s*$'
      - '^(?:quiero\s+)?(?:abrir|iniciar|ejecutar|entrar\s+a)\s+(?:el|la|los|las)?\s*(?P<target>.+?)\s*$'
    slots_required: true
    confirmation: null

  app.close:
    tool: app.close
    examples:
      - cierra spotify
      - cierra el discord
      - mata el proceso de chrome
      - termina la calculadora
      - quiero cerrar steam
      # OJO: al anadir "silencia spotify" a volume.mute, "termina el spotify" se
      # fue alli con 0.532 frente a 0.357 de aqui. Cerrar una aplicacion y
      # silenciarla son cosas MUY distintas, asi que este lado necesita sus
      # propias formas del verbo terminar.
      - termina spotify
      - mata spotify
      - cierra la aplicacion de spotify
    slot_patterns:
      - '^(?:cierra|cerrar|cierrame|mata|matar|termina|terminar|finaliza)\s+(?:me\s+)?(?:el|la|los|las)?\s*(?:proceso\s+de\s+|aplicacion\s+|app\s+|programa\s+)?(?P<app>.+?)\s*$'
      - '^(?:quiero\s+)?cerrar\s+(?:el|la)?\s*(?P<app>.+?)\s*$'
    slots_required: true
    confirmation: null

  # ------------------------------------------------------------------------ web
  web.search:
    tool: web.search
    examples:
      - busca en internet el clima de hoy
      - googlea la receta de paella
      - buscame informacion sobre python
      - investiga cuanto mide la torre eiffel
      - busca en google como hacer pan
      - que dice internet sobre las elecciones
    slot_patterns:
      - '^(?:busca|buscar|buscame|googlea|investiga|investigar)\s+(?:me\s+)?(?:en\s+(?:internet|google|la\s+web|el\s+navegador)\s+)?(?:informacion\s+(?:sobre|de|acerca\s+de)\s+)?(?P<query>.+?)\s*$'
      - '^(?:que\s+dice\s+internet\s+(?:sobre|de)|que\s+se\s+sabe\s+de)\s+(?P<query>.+?)\s*$'
    slots_required: true
    confirmation: null

  # --------------------------------------------------------------------- sistema
  system.time:
    tool: system.time
    literal:
      - que hora es
    examples:
      - que hora es
      - dime la hora
      - me dices la hora
      - que hora tenemos
      - que hora tienes
      - a que hora estamos
    confirmation: null

  # ------------------------------------------------------- clase negativa (LLM)
  # Este intent no ejecuta nada: si gana el coseno, la frase escala al LLM.
  #
  # POR QUE EXISTE: medido sobre este catalogo, un umbral absoluto no separa
  # comandos de charla (positivos hasta 0.856, negativos hasta 0.903: solapan).
  # Con una clase negativa la pregunta deja de ser "supera el umbral?" y pasa a
  # ser "se parece mas a un comando o a una conversacion?", que es una decision
  # relativa y mucho mas estable.
  #
  # COMO MANTENERLO: si una pregunta abierta se ejecuta como comando por error,
  # anadela aqui. Es el mismo gesto que anadir una parafrasis a un intent real.
  _fallback:
    fallback: true
    examples:
      - explicame la teoria de la relatividad
      - cuentame un chiste
      - que opinas de la inteligencia artificial
      - como se dice buenos dias en japones
      - escribe un correo para mi jefe
      - recuerdame comprar leche manana
      - cuanto es doscientos por trescientos
      - resumeme la noticia
      - por que el cielo es azul
      - dame ideas para la cena
      - traduce esta frase al ingles
      - ayudame a redactar un mensaje
      - que me recomiendas ver esta noche
      - hazme un resumen de lo que hice hoy
      - quien invento el telefono
      - cual es la capital de australia

  # ---------------------------------------------------------- spotify avanzado
  # Estos comandos necesitan la Web API: las teclas multimedia no pueden
  # consultar que suena ni guardar nada. Requieren Premium y los permisos
  # user-read-currently-playing y user-library-modify (ver README).
  spotify.what_song:
    tool: spotify.what_song
    literal:
      - que cancion es esta
    examples:
      - que cancion es esta
      - como se llama esta cancion
      - quien canta esto
      - de quien es esta cancion
      - que estoy escuchando
      - dime el nombre de la cancion
      - que suena ahora
    confirmation: null

  spotify.like:
    tool: spotify.like
    examples:
      - me gusta esta cancion
      - guarda esta cancion
      - anade esta cancion a mis favoritos
      - dale like a esta cancion
      - guardala en favoritos
      - marca esta cancion como favorita
      - me encanta esta cancion
    confirmation: null

  spotify.shuffle_on:
    tool: spotify.shuffle
    examples:
      - pon el modo aleatorio
      - activa el aleatorio
      - reproduce en aleatorio
      - pon las canciones en desorden
      - mezcla las canciones
    fixed_args:
      enabled: true
    confirmation: null

  spotify.shuffle_off:
    tool: spotify.shuffle
    examples:
      - quita el modo aleatorio
      - desactiva el aleatorio
      - reproduce en orden
      - pon las canciones en orden
    fixed_args:
      enabled: false
    confirmation: null

  system.date:
    tool: system.date
    literal:
      - que dia es hoy
      - que fecha es hoy
    examples:
      # OJO: sin este intent, "que dia es hoy" caia en system.time y el
      # asistente respondia con la hora. Son preguntas parecidas en forma y
      # distintas en intencion; ambas necesitan anclas propias.
      - que dia es hoy
      - que fecha es hoy
      - en que fecha estamos
      - a que dia estamos
      - dime la fecha
      - que dia de la semana es
      - cual es la fecha de hoy
      - que dia es
    confirmation: null

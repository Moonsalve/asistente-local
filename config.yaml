# Configuracion del asistente. Los secretos van en .env, no aqui.
# Los campos marcados TUNING en src/asistente/config.py son los que hay que
# barrer con scripts/benchmark.py en el PC Windows.

audio:
  input_device: null      # null = microfono por defecto. `python -m sounddevice` lista los indices.
  sample_rate: 16000
  block_size: 1280

  # Amplificacion por software, para microfonos que capturan bajo incluso con
  # el volumen de Windows al maximo.
  #
  # 8.0 es un punto de partida. El valor exacto para TU microfono lo calcula:
  #     python scripts/diagnose_audio.py
  #
  # Si ves en el log "el audio satura con gain=...", bajalo: la voz
  # distorsionada se transcribe PEOR que la floja.
  gain: 8.0

wake_word:
  # "transcript": transcribe lo que oye y busca la clave en el TEXTO. Acepta
  #   cualquier palabra en espanol sin entrenar nada. Es lo que permite usar
  #   "Apolo", para el que no existe modelo preentrenado.
  #   Coste: Whisper corre cada vez que alguien habla cerca del microfono.
  # "openwakeword": modelo dedicado siempre escuchando (1-2% de CPU), pero solo
  #   con palabras entrenadas, y las preentrenadas son inglesas.
  mode: transcript

  # Varias formas porque Whisper no transcribe igual un nombre propio cada vez.
  # Si ves en el log que ignora frases que si eran para el, anade la forma que
  # aparezca ahi.
  phrases: [apolo, apollo, a polo]
  phrase_threshold: 82.0

  # Solo en modo openwakeword. Preentrenados: hey_jarvis, alexa, hey_mycroft,
  # hey_rhasspy. "alexa" es el mas fiable para un hispanohablante porque suena
  # igual en ambos idiomas.
  model: hey_jarvis
  threshold: 0.5
  refractory_s: 2.0

vad:
  # El parametro que mas afecta a la latencia percibida. Empieza en 0.35 y baja
  # a 0.25 cuando confirmes que no te corta a media frase.
  silence_s: 0.35
  speech_threshold: 0.5
  max_utterance_s: 15.0
  preroll_s: 0.3

# Encadenar ordenes sin repetir "Apolo". Tras cada orden el asistente sigue
# escuchando unos segundos, para que "sube el volumen" / "mas" / "mas" no
# necesite decir la palabra clave tres veces.
#
# DENTRO DE LA VENTANA NO HAY PALABRA CLAVE, que es la unica defensa real
# contra ejecutar lo que se oye de la tele. Por eso solo se acepta lo de
# `tools`, y solo si el router lo resolvio SIN LLM. El criterio para anadir
# algo aqui no es "me resulta comodo" sino "que pasa si lo dispara la tele":
# si la respuesta no es "lo deshago diciendo lo contrario", no va aqui.
follow_up:
  enabled: true
  window_s: 5.0
  tools:
    - media.next
    - media.previous
    - media.play_pause
    - volume.step        # sube y baja: los dos intents usan esta skill
    - volume.set
    - volume.mute
    - volume.query
    # Deliberadamente FUERA: open.target y web.search abririan ventanas encima
    # de lo que estes haciendo, spotify.play necesita un titulo (y con el, el
    # LLM, que la ventana ya rechaza), y spotify.like te ensucia la biblioteca.

stt:
  model: large-v3-turbo
  device: cuda
  compute_type: int8_float16
  language: es
  beam_size: 1
  condition_on_previous_text: false
  # Sube cada frase al nivel que Whisper espera. Problema distinto al de
  # `audio.gain`: aquel ayuda al VAD en vivo, este al STT sobre la frase ya
  # grabada. Hacen falta los dos.
  normalize_audio: true
  normalize_peak: 0.95

router:
  embedding_model: intfloat/multilingual-e5-small
  embedding_onnx_file: onnx/model.onnx
  embedding_on_gpu: false   # en CPU cuesta ~2 ms; no merece ocupar VRAM
  threshold: 0.25

llm:
  # Un solo modelo para el router y para corregir titulos de canciones: en 8 GB
  # de VRAM no caben dos junto a Whisper (1.6 + 4.7 + 0.5 KV = 6.8 de 8).
  # Si el log de Ollama menciona capas en CPU, vuelve a qwen2.5:3b-instruct-q4_K_M
  # desde config.local.yaml.
  model: qwen2.5:7b-instruct-q4_K_M
  host: http://127.0.0.1:11434
  keep_alive: -1          # numero, no cadena: "-1" da HTTP 400 en Ollama
  temperature: 0.0
  timeout_s: 10.0

tts:
  voice_model: models/es_MX-claude-high.onnx
  speed: 1.0
  stream_by_sentence: true

spotify:
  enabled: true
  redirect_uri: http://127.0.0.1:8888/callback
  fallback_to_media_keys: true
  # El LLM corrige el titulo cuando Spotify no encuentra nada. Solo se paga en
  # las peticiones que YA habian fallado: lo que hoy funciona no se ralentiza.
  resolve_with_llm: true
  # Indexar tus me gusta al arrancar (hasta 20 peticiones) para emparejar contra
  # ellos antes de tocar el catalogo publico. Es el paso barato de la cascada.
  index_library: true

# ---------------------------------------------------------------------------
# ALLOWLIST DE APLICACIONES
# Frontera de seguridad: lo que no aparezca aqui no se puede abrir ni cerrar,
# venga el comando del catalogo o del LLM. Anade solo lo que uses.
# Ajusta las rutas a tu instalacion en Windows.
# ---------------------------------------------------------------------------
apps:
  spotify:
    command: spotify
    process: Spotify
    aliases: [spoti, spotifai]
  chrome:
    command: chrome
    process: chrome
    aliases: [google chrome, navegador, el navegador]
  discord:
    command: discord
    process: Discord
    aliases: [discor]
  explorador:
    command: explorer
    process: explorer
    aliases: [explorador de archivos, archivos, carpetas]
  calculadora:
    command: calc
    process: CalculatorApp
    aliases: [calculator, la calculadora]
  notas:
    command: notepad
    process: notepad
    aliases: [bloc de notas, notepad, block de notas]
  terminal:
    command: wt
    process: WindowsTerminal
    aliases: [consola, cmd, powershell]
  vscode:
    command: code
    process: Code
    aliases: [visual studio code, vs code, el code, editor]
  steam:
    command: steam
    process: steam
    aliases: []

# ---------------------------------------------------------------------------
# SITIOS CONOCIDOS
# Si `open.target` no encuentra la palabra en `apps`, la busca aqui. Si tampoco
# esta, cae a una busqueda web: nunca se queda sin hacer nada.
# ---------------------------------------------------------------------------
sites:
  youtube: https://www.youtube.com
  gmail: https://mail.google.com
  correo: https://mail.google.com
  github: https://github.com
  netflix: https://www.netflix.com
  twitch: https://www.twitch.tv
  reddit: https://www.reddit.com
  wikipedia: https://es.wikipedia.org
  whatsapp: https://web.whatsapp.com
  chatgpt: https://chat.openai.com
  drive: https://drive.google.com
  maps: https://maps.google.com
  traductor: https://translate.google.com

# ---------------------------------------------------------------------------
# NAVEGADOR Y BUSCADOR
# ---------------------------------------------------------------------------
web:
  # Navegador en el que se abre TODO: busquedas y paginas.
  # Conocidos: brave, chrome, firefox, edge, opera, vivaldi.
  # Cadena vacia ("") = usar el navegador por defecto de Windows.
  browser: brave
  # Si no lo encuentra solo, pon la ruta en config.local.yaml:
  #   web:
  #     browser_path: 'C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe'
  browser_path: null

  # Buscador. Alternativas:
  #   Brave Search  https://search.brave.com/search?q={query}
  #   DuckDuckGo    https://duckduckgo.com/?q={query}
  search_url: https://www.google.com/search?q={query}

# ---------------------------------------------------------------------------
# AUTODESCUBRIMIENTO DE APLICACIONES
# Al arrancar enumera lo instalado (Store, escritorio y juegos de Steam) y lo
# anade a la allowlist. Lo declarado a mano en `apps:` siempre tiene prioridad.
#
# SEGURIDAD: con esto la allowlist deja de ser una lista curada y pasa a ser
# "todo lo instalado". Ponlo en false si prefieres controlar exactamente que
# se puede abrir.
# ---------------------------------------------------------------------------
discovery:
  enabled: true
  steam: true
  cache_hours: 24.0

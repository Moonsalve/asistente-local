[project]
name = "asistente-local"
version = "0.1.0"
description = "Asistente de voz 100% local para Windows: wake word + STT + router semantico + skills"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Configuracion y validacion
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "PyYAML>=6.0",
    # Router semantico (embeddings sin arrastrar torch)
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "rapidfuzz>=3.10",
    # STT
    "faster-whisper>=1.0.3",
    # Audio
    "sounddevice>=0.5",
    "openwakeword>=0.6",
    # TTS
    "piper-tts>=1.2",
    # LLM fallback
    "ollama>=0.3",
    # Verificacion de locutor: fbank de Kaldi en C++, sin arrastrar torch.
    # Una implementacion casera en numpy no falla, produce embeddings plausibles
    # que no discriminan, y el sintoma seria "a veces no me reconoce".
    "kaldi-native-fbank>=1.20",
    # Skills
    "spotipy>=2.24",
    # Control de sistema (solo Windows)
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
# CUDA en Windows. CTranslate2 (el motor de faster-whisper) enlaza contra
# cuBLAS y cuDNN de CUDA 12, que NO vienen con el driver de NVIDIA. Sin estos
# paquetes el STT falla con "Library cublas64_12.dll is not found".
# Ver src/asistente/cuda_setup.py para por que ademas hay que registrar los
# directorios de DLL a mano en Windows.
gpu = [
    "onnxruntime-gpu>=1.19",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
asistente = "asistente.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistente"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
# Estas librerias no publican type stubs.
[[tool.mypy.overrides]]
module = ["sounddevice.*", "openwakeword.*", "piper.*", "spotipy.*", "pycaw.*", "faster_whisper.*"]
ignore_missing_imports = true
